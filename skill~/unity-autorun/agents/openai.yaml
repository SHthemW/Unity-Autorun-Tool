interface:
  display_name: "Unity Autorun"
  short_description: "Explicit Unity UI navigation and self-tests"
  default_prompt: "Use $unity-autorun for this request to check compatibility, navigate, inspect supported UI state, and verify the requested result."

dependencies:
  tools:
    - type: "mcp"
      value: "unity-autorun"
      description: "Local Unity Autorun MCP server for UI navigation, inspection, and self-tests"

policy:
  allow_implicit_invocation: false
